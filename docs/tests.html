<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shortfall — tests</title>
<style>
  :root { --paper:#fbfaf7; --ink:#14181d; --soft:#4a525c; --rule:#d9d4c8; --bad:#b3261e; --good:#1b6b45; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font-family:"Inter","Pretendard","Apple SD Gothic Neo",system-ui,sans-serif; line-height:1.5; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 32px 22px 70px; }
  h1 { font-size: 24px; margin: 0 0 6px; letter-spacing: -0.02em; }
  p.lead { color: var(--soft); margin: 0 0 18px; font-size: 14px; }
  #summary { display:inline-block; font-family: ui-monospace, monospace; font-size: 15px; padding: 6px 12px; border-radius: 7px; background:#eee; }
  #summary.pass { background:#e8f3ec; color:var(--good); }
  #summary.fail { background:#fdecea; color:var(--bad); }
  #headline { font-size: 17px; font-weight: 600; margin: 14px 0 22px; }
  section.g { border-top: 1px solid var(--rule); padding: 12px 0; }
  section.g h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .07em; margin: 0 0 6px; color: var(--soft); font-weight: 600; }
  section.g h2 span { color: var(--ink); font-family: ui-monospace, monospace; }
  .allok { color: var(--good); font-size: 13px; margin: 0; }
  ul { margin: 0; padding-left: 18px; font-size: 13px; }
  li.bad { color: var(--bad); margin-bottom: 4px; }
  a { color: #1d4ed8; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Shortfall — the rules, checked</h1>
  <p class="lead">The same modules the page loads, run against cases where a wrong answer changes someone's pay. <a href="index.html">← back to the app</a></p>
  <div id="summary">running…</div>
  <div id="headline"></div>
  <div id="groups"></div>
</div>
<script type="module" src="tests.js?v=7"></script>
</body>
</html>
